.mxt td.q0{background:#E3E8EE}.mxt td.q1{background:#C3D2E2}.mxt td.q2{background:#9DB4CF}.mxt td.q3{background:#6F92BA}.mxt td.q4{background:#3E6A9A}.mxt td.est{background-image:radial-gradient(rgba(0,0,0,.35) 1px,transparent 1.2px);background-size:4px 4px}

<script>
'use strict';
/* =====================================================================
   CYCLE MATRIX
   A period, mood and PMDD symptom tracker that looks for patterns: across your cycle, and between food groups and how you feel.
   One file, vanilla JS, works offline. Your data stays in this browser.

   DAILY CHECK-IN: period flow, mood, symptoms on a 1-6 scale (the scale used for PMDD tracking), which food groups you had, a few other things.
   SECTIONS 1 Config · 2 Utilities · 3 State · 4 Cycles & prediction · 5 Phases · 6 Hormone model · 7 Daily scores
            8 PMDD pattern check (C-PASS method) · 9 Food associations · 10 Charts · 11 Views · 12 Actions · 13 Export/import · 14 Boot
   NOT A DIAGNOSIS. It organises your own ratings the way a clinician would want to see them.
   ===================================================================== */

/* ---------------------------------------------------------------------
   1. CONFIG
   --------------------------------------------------------------------- */
const APP = 'Cycle Matrix', KEY = 'cm_v1';
/* Symptom items, rated 1 (not at all) to 6 (extreme). Grouped into the 11 DSM-5 PMDD symptom areas (d), plus 3 "got in the way" items. */
const ITEMS = [
  { k: 'dep', n: 'Low, sad or down', d: 'B3', g: 'emo' }, { k: 'hop', n: 'Hopeless', d: 'B3', g: 'emo' }, { k: 'wor', n: 'Worthless or guilty', d: 'B3', g: 'emo' },
  { k: 'anx', n: 'Anxious, tense or on edge', d: 'B4', g: 'emo' }, { k: 'swg', n: 'Mood swings or suddenly tearful', d: 'B1', g: 'emo' }, { k: 'rej', n: 'Sensitive to rejection, easily hurt', d: 'B1', g: 'emo' },
  { k: 'irr', n: 'Irritable or angry', d: 'B2', g: 'emo' }, { k: 'con', n: 'Conflict or friction with people', d: 'B2', g: 'emo' },
  { k: 'int', n: 'Less interest in usual things', d: 'C1', g: 'beh' }, { k: 'foc', n: 'Hard to concentrate', d: 'C2', g: 'beh' }, { k: 'tir', n: 'Tired or low on energy', d: 'C3', g: 'beh' },
  { k: 'app', n: 'Ate more than usual', d: 'C4', g: 'beh' }, { k: 'cra', n: 'Cravings for particular foods', d: 'C4', g: 'beh' }, { k: 'hyp', n: 'Slept more, hard to get up', d: 'C5', g: 'beh' },
  { k: 'ins', n: 'Trouble falling or staying asleep', d: 'C5', g: 'beh' }, { k: 'ovw', n: 'Overwhelmed, unable to cope', d: 'C6', g: 'beh' }, { k: 'ctl', n: 'Felt out of control', d: 'C6', g: 'beh' },
  { k: 'brs', n: 'Breast tenderness or swelling', d: 'C7', g: 'phy' }, { k: 'blt', n: 'Bloating or weight gain', d: 'C7', g: 'phy' }, { k: 'hed', n: 'Headache', d: 'C7', g: 'phy' }, { k: 'pai', n: 'Joint or muscle pain', d: 'C7', g: 'phy' },
  { k: 'wrk', n: 'Got in the way of work or study', d: 'I', g: 'imp' }, { k: 'soc', n: 'Got in the way of hobbies or social life', d: 'I', g: 'imp' }, { k: 'rel', n: 'Got in the way of relationships', d: 'I', g: 'imp' }
];
/* Not part of the PMDD scoring: period pain, a wider pain-and-body set, and the safety question. */
const EXTRA = [{ k: 'crm', n: 'Cramps or period pain', g: 'phy' },
  { k: 'pan', n: 'Pain overall', g: 'fib' }, { k: 'stf', n: 'Stiffness (on waking or after sitting)', g: 'fib' }, { k: 'tch', n: 'Sore to the touch, light pressure hurts', g: 'fib' },
  { k: 'tng', n: 'Tingling, numbness or burning', g: 'fib' }, { k: 'sen', n: 'Sensitive to noise, light, clothes or temperature', g: 'fib' }, { k: 'unr', n: 'Woke up unrefreshed', g: 'fib' },
  { k: 'exh', n: 'Worn out after normal activity', g: 'fib' }, { k: 'mem', n: 'Memory slips or trouble finding words', g: 'fib' }, { k: 'gut', n: 'Stomach or bowel trouble', g: 'fib' }, { k: 'rls', n: 'Restless or twitchy legs', g: 'fib' },
  { k: 'sui', n: 'Thoughts of self-harm or not wanting to be here', g: 'safe' }];
const FIB = EXTRA.filter(i => i.g === 'fib');
/* Where it hurt today. The number of areas shows how widespread pain is. */
const REGIONS = [['neck', 'Neck'], ['jaw', 'Jaw'], ['head', 'Head'], ['shoulders', 'Shoulders'], ['upperback', 'Upper back'], ['lowerback', 'Lower back'], ['chest', 'Chest'], ['arms', 'Arms'], ['hands', 'Hands, wrists'], ['stomach', 'Stomach'], ['hips', 'Hips'], ['thighs', 'Thighs'], ['knees', 'Knees'], ['calves', 'Calves, shins'], ['feet', 'Feet, ankles']];
const QUICK = ['anx', 'irr', 'dep', 'swg', 'tir'];
const GROUPS = { emo: 'Mood and feelings', beh: 'Energy, sleep, appetite, coping', phy: 'Physical', fib: 'Pain, body and senses', imp: 'Impact on your day', safe: 'Safety' };
const DOMAINS = { B1: 'Mood swings, rejection sensitivity', B2: 'Irritability, conflict', B3: 'Low mood, hopelessness', B4: 'Anxiety, tension', C1: 'Less interest', C2: 'Concentration', C3: 'Fatigue', C4: 'Appetite, cravings', C5: 'Sleep', C6: 'Overwhelmed, out of control', C7: 'Physical symptoms' };
const SCALE = ['Not at all', 'Minimal', 'Mild', 'Moderate', 'Severe', 'Extreme'];
const MOODS = [['😣', 'Very low'], ['😕', 'Low'], ['😐', 'Okay'], ['🙂', 'Good'], ['😄', 'Great']];
const FLOW = ['None', 'Spotting', 'Light', 'Medium', 'Heavy'];
const DEFAULT_FOODS = [
  { id: 'f_caf', n: 'Caffeine', i: '☕' }, { id: 'f_alc', n: 'Alcohol', i: '🍷' }, { id: 'f_sug', n: 'Sugar and sweets', i: '🍬' }, { id: 'f_cho', n: 'Chocolate', i: '🍫' },
  { id: 'f_ref', n: 'Refined carbs', i: '🍞' }, { id: 'f_who', n: 'Whole grains', i: '🌾' }, { id: 'f_veg', n: 'Vegetables', i: '🥦' }, { id: 'f_fru', n: 'Fruit', i: '🍎' },
  { id: 'f_dai', n: 'Dairy', i: '🧀' }, { id: 'f_red', n: 'Red meat', i: '🥩' }, { id: 'f_fsh', n: 'Oily fish', i: '🐟' }, { id: 'f_nut', n: 'Nuts and seeds', i: '🥜' },
  { id: 'f_leg', n: 'Beans and lentils', i: '🫘' }, { id: 'f_sal', n: 'Salty or processed', i: '🧂' }, { id: 'f_fry', n: 'Fried or fast food', i: '🍟' }, { id: 'f_spi', n: 'Spicy food', i: '🌶️' }];
/* Medication: a daily dose per medicine. step = the dose change the analysis reports per (e.g. per 25 mg). */
const DEFAULT_MEDS = [{ id: 'm_ser', n: 'Sertraline', u: 'mg', step: 25 }];
const KNOWN_MEDS = ['sertraline', 'fluoxetine', 'citalopram', 'escitalopram', 'paroxetine', 'fluvoxamine', 'venlafaxine', 'duloxetine', 'gabapentin', 'pregabalin', 'propranolol', 'drospirenone', 'naproxen', 'ibuprofen'];
const DEFAULT_TAGS = [{ id: 't_ex', n: 'Exercised', i: '🏃' }, { id: 't_bs', n: 'Slept badly', i: '😴' }, { id: 't_st', n: 'Stressful day', i: '⚡' }, { id: 't_pk', n: 'Took painkillers', i: '💊' }];
const PHASES = { men: { n: 'Period', c: '#C2477A' }, fol: { n: 'Follicular', c: '#4C9F70' }, ovu: { n: 'Ovulation (est.)', c: '#D9A400' }, lut: { n: 'Luteal', c: '#5B7FA6' }, pre: { n: 'Premenstrual week', c: '#8E6BBF' } };
const PHASE_ORDER = ['men', 'fol', 'ovu', 'lut', 'pre'];
const DEF = { cycle: 28, luteal: 14, period: 5 };
/* C-PASS (Eisenlohr-Moul et al. 2017): premenstrual week = days -7..-1, postmenstrual week = days 4..10 after onset.
   An item meets the pattern when: premenstrual mean - postmenstrual mean >= 30% of the range of the scale you use for it,
   no postmenstrual day above 3, and at least 2 premenstrual days at 4 (moderate) or more. */
const CPASS = { elev: 30, clearMax: 3, sevMin: 4, sevDays: 2, minDays: 4 };
const SAFE_SHOW = 3;          // show the support card when the safety item is rated this or higher

/* ---------------------------------------------------------------------
   2. UTILITIES
   --------------------------------------------------------------------- */
const $ = s => document.querySelector(s);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const fmt = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const ds = o => { const d = new Date(); d.setDate(d.getDate() + o); return fmt(d); };
const sh = (dt, n) => { const d = new Date(dt + 'T12:00:00'); d.setDate(d.getDate() + n); return fmt(d); };
const dd = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const f1 = n => (+n).toFixed(1), f2 = n => (+n).toFixed(2), pc = x => Math.round(x * 100);
const sg = (n, dp = 1) => { const v = +(+n).toFixed(dp); return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(dp); };
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const svar = a => { if (a.length < 2) return null; const m = mean(a); return a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1); };
const sdv = a => { const v = svar(a); return v == null ? null : Math.sqrt(v); };
const median = a => { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y), m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pretty = dt => new Date(dt + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const prettyY = dt => new Date(dt + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const shortD = dt => new Date(dt + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const monday = dt => { const d = new Date(dt + 'T12:00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return fmt(d); };
